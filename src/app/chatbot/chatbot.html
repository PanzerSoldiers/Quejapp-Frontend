<div class="h-screen flex flex-col bg-gray-100">

  <!-- Header -->
  <div class="bg-orange-600 text-white p-4 flex items-center justify-between shadow">
    <h1 class="font-bold">Asistente QuejApp 🤖</h1>
    <button routerLink="/" class="bg-white text-orange-600 px-3 py-1 rounded">
      Salir
    </button>
  </div>

  <!-- Chat -->
  <div class="flex-1 overflow-y-auto p-4 space-y-3">

    <div *ngFor="let msg of messages"
         class="flex"
         [ngClass]="{
           'justify-end': msg.from === 'user',
           'justify-start': msg.from === 'bot'
         }">

      <div class="max-w-xs md:max-w-md px-4 py-2 rounded-2xl shadow"
           [ngClass]="{
             'bg-orange-500 text-white rounded-br-none': msg.from === 'user',
             'bg-white text-gray-800 rounded-bl-none': msg.from === 'bot'
           }">

        {{ msg.text }}
      </div>
    </div>

    <!-- typing indicator -->
    <div *ngIf="loading" class="flex justify-start">
      <div class="bg-white px-4 py-2 rounded-2xl shadow text-gray-500 italic">
        escribiendo...
      </div>
    </div>

  </div>

  <!-- Input -->
  <div class="p-4 bg-white border-t flex gap-2">

    <input [(ngModel)]="userMessage"
           (keyup.enter)="sendMessage()"
           placeholder="Escribe tu mensaje..."
           class="flex-1 border rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">

    <button (click)="sendMessage()"
            class="bg-orange-600 text-white px-5 py-2 rounded-full hover:bg-orange-700 transition">
      ➤
    </button>

  </div>

</div>
